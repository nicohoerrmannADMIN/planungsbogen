<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Planungsbogen · Admin</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --b50: #E6F1FB; --b100: #B5D4F4; --b400: #378ADD; --b600: #185FA5; --b800: #0C447C;
    --g50: #F7F8FA; --g100: #EEF0F4; --g300: #C8CDD8; --g500: #7A8299; --g700: #3D4358; --g900: #1A1D2E;
    --white: #fff; --rsm: 8px; --rmd: 12px; --rlg: 18px;
    --shadow: 0 2px 16px rgba(24,95,165,0.08), 0 1px 3px rgba(24,95,165,0.06);
    --green: #1D9E75; --green-bg: #E1F5EE;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--g50); color: var(--g900); min-height: 100vh; }

  /* LOGIN */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
  .login-card { background: var(--white); border-radius: var(--rlg); box-shadow: var(--shadow); border: 1px solid var(--g100); padding: 2.5rem; width: 100%; max-width: 380px; text-align: center; }
  .login-icon { width: 52px; height: 52px; border-radius: 14px; background: var(--b400); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem; }
  .login-icon svg { width: 24px; height: 24px; }
  .login-card h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .login-card p { font-size: 13px; color: var(--g500); margin-bottom: 1.5rem; }
  .login-card input { width: 100%; padding: 11px 14px; font-size: 15px; border: 1.5px solid var(--g100); border-radius: var(--rsm); background: var(--g50); color: var(--g900); outline: none; font-family: inherit; margin-bottom: 12px; }
  .login-card input:focus { border-color: var(--b400); background: var(--white); box-shadow: 0 0 0 3px rgba(55,138,221,.12); }
  .btn-login { width: 100%; padding: 12px; background: var(--b400); color: var(--white); border: none; border-radius: var(--rsm); font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; transition: background .15s; }
  .btn-login:hover { background: var(--b600); }
  .login-err { font-size: 13px; color: #A32D2D; margin-top: 8px; display: none; }

  /* TOPBAR */
  .topbar { background: var(--white); border-bottom: 1px solid var(--g100); padding: 0 2rem; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .topbar-logo { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: var(--b600); }
  .topbar-icon { width: 30px; height: 30px; border-radius: 8px; background: var(--b400); display: flex; align-items: center; justify-content: center; }
  .topbar-icon svg { width: 16px; height: 16px; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .badge-count { font-size: 12px; font-weight: 600; background: var(--b50); color: var(--b600); padding: 4px 10px; border-radius: 99px; border: 1px solid var(--b100); }
  .btn-logout { font-size: 13px; color: var(--g500); background: none; border: 1px solid var(--g300); border-radius: var(--rsm); padding: 6px 12px; cursor: pointer; font-family: inherit; }
  .btn-logout:hover { color: var(--g700); border-color: var(--g500); }

  /* MAIN */
  .main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 10px; }
  .section-header h2 { font-size: 18px; font-weight: 600; }

  /* FILTERS */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-input { padding: 8px 12px; font-size: 13px; border: 1px solid var(--g100); border-radius: var(--rsm); background: var(--white); color: var(--g900); outline: none; font-family: inherit; min-width: 180px; }
  .filter-input:focus { border-color: var(--b400); }

  /* TABLE */
  .table-wrap { background: var(--white); border-radius: var(--rlg); border: 1px solid var(--g100); box-shadow: var(--shadow); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead th { padding: 12px 16px; text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--g500); border-bottom: 1px solid var(--g100); background: var(--g50); white-space: nowrap; }
  tbody tr { border-bottom: 1px solid var(--g100); transition: background .1s; cursor: pointer; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--b50); }
  tbody td { padding: 13px 16px; font-size: 14px; color: var(--g700); }
  .td-name { font-weight: 600; color: var(--g900); }
  .td-berater { font-size: 12px; color: var(--g500); }
  .badge-beruf { font-size: 11px; padding: 3px 8px; border-radius: 99px; background: var(--b50); color: var(--b600); border: 1px solid var(--b100); font-weight: 500; white-space: nowrap; }
  .td-date { font-size: 12px; color: var(--g500); white-space: nowrap; }
  .btn-pdf { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; background: var(--b400); color: var(--white); border: none; border-radius: var(--rsm); font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; transition: background .15s; white-space: nowrap; }
  .btn-pdf:hover { background: var(--b600); }
  .empty-state { text-align: center; padding: 4rem 2rem; color: var(--g500); }
  .empty-state svg { width: 40px; height: 40px; margin: 0 auto 1rem; display: block; opacity: .3; }

  /* MODAL / DETAIL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(26,29,46,.45); z-index: 200; display: flex; align-items: flex-start; justify-content: center; padding: 2rem 1rem; overflow-y: auto; }
  .modal { background: var(--white); border-radius: var(--rlg); width: 100%; max-width: 680px; box-shadow: 0 8px 40px rgba(24,95,165,.18); }
  .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--g100); }
  .modal-header h3 { font-size: 17px; font-weight: 600; }
  .modal-actions { display: flex; gap: 8px; }
  .btn-close { background: none; border: 1px solid var(--g300); border-radius: var(--rsm); padding: 7px 14px; font-size: 13px; color: var(--g700); cursor: pointer; font-family: inherit; }
  .btn-close:hover { background: var(--g50); }
  .modal-body { padding: 1.5rem; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .detail-section { margin-bottom: 1.25rem; }
  .detail-section h4 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--b400); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--g100); }
  .detail-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 5px 0; border-bottom: 1px solid var(--g50); }
  .detail-row:last-child { border-bottom: none; }
  .detail-key { font-size: 12px; color: var(--g500); flex-shrink: 0; min-width: 120px; }
  .detail-val { font-size: 13px; color: var(--g900); font-weight: 500; text-align: right; word-break: break-word; }
  .tag-list { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
  .tag { font-size: 11px; padding: 2px 7px; border-radius: 99px; background: var(--b50); color: var(--b600); border: 1px solid var(--b100); }

  /* Loading */
  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--b100); border-top-color: var(--b400); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-row { text-align: center; padding: 3rem; }

  .hidden { display: none !important; }

  @media(max-width:600px) {
    .detail-grid { grid-template-columns: 1fr; }
    .main { padding: 1rem; }
    .topbar { padding: 0 1rem; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="login-wrap">
  <div class="login-card">
    <div class="login-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1>Admin · Planungsbogen</h1>
    <p>Nur für interne Nutzung</p>
    <input type="password" id="pw-input" placeholder="Passwort" onkeydown="if(event.key==='Enter')doLogin()" />
    <button class="btn-login" onclick="doLogin()">Einloggen</button>
    <p class="login-err" id="login-err">Falsches Passwort</p>
  </div>
</div>

<!-- ADMIN APP -->
<div id="admin-app" class="hidden">
  <div class="topbar">
    <div class="topbar-logo">
      <div class="topbar-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
      </div>
      Planungsbogen Admin
    </div>
    <div class="topbar-right">
      <span class="badge-count" id="total-count">0 Einträge</span>
      <button class="btn-logout" onclick="logout()">Abmelden</button>
    </div>
  </div>

  <div class="main">
    <div class="section-header">
      <h2>Alle Einreichungen</h2>
      <div class="filters">
        <input class="filter-input" type="text" id="search-input" placeholder="Name oder Berater suchen…" oninput="renderTable()" />
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Beruf</th>
            <th>Berater</th>
            <th>Datum</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="5" class="loading-row"><div class="spinner"></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay hidden" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h3 id="modal-title">–</h3>
      <div class="modal-actions">
        <button class="btn-pdf" onclick="downloadPDF()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          PDF
        </button>
        <button class="btn-close" onclick="document.getElementById('modal-overlay').classList.add('hidden')">Schließen</button>
      </div>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
const SUPA_URL = 'https://jtlblbgxzbxjplamdpiu.supabase.co';
const SUPA_KEY = 'sb_publishable_XZaNy8RC0iATbuq2IVJ0Qg_9qNDsMBd';
const ADMIN_PW = 'planungsadmin2025';

let allRows = [];
let currentRow = null;

function doLogin() {
  const val = document.getElementById('pw-input').value;
  if (val === ADMIN_PW) {
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('admin-app').classList.remove('hidden');
    loadData();
  } else {
    document.getElementById('login-err').style.display = 'block';
  }
}

function logout() {
  document.getElementById('admin-app').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('pw-input').value = '';
}

async function loadData() {
  try {
    const res = await fetch(SUPA_URL + '/rest/v1/planungsbogen?select=*&order=created_at.desc', {
      headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY }
    });
    if (!res.ok) throw new Error();
    allRows = await res.json();
    document.getElementById('total-count').textContent = allRows.length + ' Einträge';
    renderTable();
  } catch {
    document.getElementById('table-body').innerHTML = '<tr><td colspan="5" style="text-align:center;padding:2rem;color:#A32D2D;">Ladefehler – Verbindung prüfen</td></tr>';
  }
}

function renderTable() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const rows = allRows.filter(r => {
    const name = ((r.vorname || '') + ' ' + (r.nachname || '')).toLowerCase();
    const berater = (r.berater || '').toLowerCase();
    return !q || name.includes(q) || berater.includes(q);
  });

  if (!rows.length) {
    document.getElementById('table-body').innerHTML = `<tr><td colspan="5"><div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>Keine Einträge gefunden</div></td></tr>`;
    return;
  }

  document.getElementById('table-body').innerHTML = rows.map(r => {
    const d = r.data || {};
    const name = [r.vorname, r.nachname].filter(Boolean).join(' ') || '–';
    const beruf = d.beruf || '–';
    const berater = r.berater || '–';
    const date = r.created_at ? new Date(r.created_at).toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '–';
    return `<tr onclick="openModal('${r.id}')">
      <td><div class="td-name">${name}</div></td>
      <td><span class="badge-beruf">${beruf}</span></td>
      <td class="td-berater">${berater}</td>
      <td class="td-date">${date}</td>
      <td><button class="btn-pdf" onclick="event.stopPropagation();downloadPDFById('${r.id}')">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        PDF</button></td>
    </tr>`;
  }).join('');
}

function openModal(id) {
  currentRow = allRows.find(r => r.id === id);
  if (!currentRow) return;
  const d = currentRow.data || {};
  const name = [currentRow.vorname, currentRow.nachname].filter(Boolean).join(' ') || 'Unbekannt';
  document.getElementById('modal-title').textContent = name;
  document.getElementById('modal-body').innerHTML = buildDetail(d);
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function closeModal(e) {
  if (e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.add('hidden');
  }
}

function row(key, val) {
  if (!val) return '';
  if (Array.isArray(val)) {
    if (val.length === 0) return '';
    if (typeof val[0] === 'object') {
      return `<div class="detail-row"><span class="detail-key">${key}</span><div class="detail-val">${val.map(k => k.name + (k.geb ? ' (' + k.geb + ')' : '')).join('<br>')}</div></div>`;
    }
    return `<div class="detail-row"><span class="detail-key">${key}</span><div class="detail-val tag-list">${val.map(v => `<span class="tag">${v}</span>`).join('')}</div></div>`;
  }
  return `<div class="detail-row"><span class="detail-key">${key}</span><span class="detail-val">${val}</span></div>`;
}

function sec(title, content) {
  if (!content.trim()) return '';
  return `<div class="detail-section"><h4>${title}</h4>${content}</div>`;
}

function buildDetail(d) {
  const date = currentRow.created_at ? new Date(currentRow.created_at).toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '';
  return `
    ${sec('Persönliches', 
      row('Anrede', d.anrede) +
      row('Name', [d.vorname, d.nachname].filter(Boolean).join(' ')) +
      row('Geburtsdatum', d.geburtsdatum) +
      row('Familienstand', d.familienstand) +
      row('Verheiratet seit', d.heiratsdatum) +
      row('Kinder', d.kinder)
    )}
    ${sec('Kontakt',
      row('Adresse', [d.strasse, d.plz, d.ort].filter(Boolean).join(', ')) +
      row('Bundesland', d.bundesland) +
      row('Telefon', d.telefon) +
      row('E-Mail', d.email)
    )}
    ${sec('Beruf',
      row('Beruf', d.beruf) +
      row('Berufsbezeichnung', d.berufsbezeichnung) +
      row('Ausbildungsberuf', d.ausbildungsberuf) +
      row('Lehrjahr', d.lehrjahr) +
      row('Studiengang', d.studiengang) +
      row('Semester', d.semester) +
      row('Studienabschluss', d.studienabschluss) +
      row('Branche', d.branche) +
      row('Rechtsform', d.rechtsform) +
      row('Selbstständig seit', d['selbst-seit']) +
      row('Beamtenverhältnis', d.beamtenverhaeltnis) +
      row('Dienstbeginn', d.dienstbeginn) +
      row('Besoldungsgruppe', d.besoldungsgruppe) +
      row('Besoldungsstufe', d.besoldungsstufe) +
      row('Dienststelle', d.dienststelle) +
      row('Bildungsabschluss', d.bildung) +
      row('Ausbildung', d.ausbildung) +
      row('Körperlich %', d.koerperlich || d['koerperlich-az'] || d['koerperlich-ss'])
    )}
    ${sec('Finanzen',
      row('Jahresbrutto', d.jahresbrutto ? d.jahresbrutto + ' €' : '') +
      row('Netto / Monat', d.netto ? d.netto + ' €' : '') +
      row('Ausgaben / Monat', d.ausgaben ? d.ausgaben + ' €' : '') +
      row('Rücklagen', d.ruecklagen ? d.ruecklagen + ' €' : '') +
      row('Laufende Kredite', d.schulden) +
      row('Kredit-Details', d.schulden_info)
    )}
    ${sec('Gesundheit',
      row('Größe', d.groesse ? d.groesse + ' cm' : '') +
      row('Gewicht', d.gewicht ? d.gewicht + ' kg' : '') +
      row('Krankenkasse', d.krankenkasse) +
      row('Raucher', d.raucher)
    )}
    ${sec('Wünsche & Planung',
      row('Immobilie', d.immobilie) +
      row('Wunschrente / Monat', d.wunschrente ? d.wunschrente + ' €' : '') +
      row('Rentenalter', d.rentenalter) +
      row('Prioritäten', d.prioritaeten) +
      row('Sonstiges', d.sonstiges)
    )}
    ${sec('Meta',
      row('Berater', d.berater) +
      row('Eingereicht am', date)
    )}
  `;
}

// ── PDF ───────────────────────────────────────────────────────
function downloadPDFById(id) {
  currentRow = allRows.find(r => r.id === id);
  if (currentRow) downloadPDF();
}

function downloadPDF() {
  if (!currentRow) return;
  const d = currentRow.data || {};
  const name = [currentRow.vorname, currentRow.nachname].filter(Boolean).join(' ') || 'Unbekannt';
  const date = currentRow.created_at ? new Date(currentRow.created_at).toLocaleDateString('de-DE') : '';

  const lines = [];

  function addSection(title, fields) {
    const entries = fields.filter(([,v]) => v);
    if (!entries.length) return;
    lines.push({ type: 'section', text: title });
    entries.forEach(([k, v]) => {
      if (Array.isArray(v)) {
        if (typeof v[0] === 'object') lines.push({ type: 'field', key: k, val: v.map(x => x.name + (x.geb ? ' (' + x.geb + ')' : '')).join(', ') });
        else lines.push({ type: 'field', key: k, val: v.join(', ') });
      } else {
        lines.push({ type: 'field', key: k, val: String(v) });
      }
    });
  }

  addSection('Persönliches', [
    ['Anrede', d.anrede],
    ['Name', [d.vorname, d.nachname].filter(Boolean).join(' ')],
    ['Geburtsdatum', d.geburtsdatum],
    ['Familienstand', d.familienstand],
    ['Verheiratet seit', d.heiratsdatum],
    ['Kinder', d.kinder],
  ]);
  addSection('Kontakt', [
    ['Adresse', [d.strasse, d.plz, d.ort].filter(Boolean).join(', ')],
    ['Bundesland', d.bundesland],
    ['Telefon', d.telefon],
    ['E-Mail', d.email],
  ]);
  addSection('Beruf', [
    ['Beruf', d.beruf],
    ['Berufsbezeichnung', d.berufsbezeichnung],
    ['Ausbildungsberuf', d.ausbildungsberuf],
    ['Lehrjahr', d.lehrjahr],
    ['Studiengang', d.studiengang],
    ['Semester', d.semester],
    ['Studienabschluss', d.studienabschluss],
    ['Branche', d.branche],
    ['Rechtsform', d.rechtsform],
    ['Selbstständig seit', d['selbst-seit']],
    ['Beamtenverhältnis', d.beamtenverhaeltnis],
    ['Dienstbeginn', d.dienstbeginn],
    ['Besoldungsgruppe', d.besoldungsgruppe],
    ['Besoldungsstufe', d.besoldungsstufe],
    ['Dienststelle', d.dienststelle],
    ['Bildungsabschluss', d.bildung],
    ['Ausbildung', d.ausbildung],
    ['Körperlich %', d.koerperlich || d['koerperlich-az'] || d['koerperlich-ss']],
  ]);
  addSection('Finanzen', [
    ['Jahresbrutto', d.jahresbrutto ? d.jahresbrutto + ' €' : ''],
    ['Netto / Monat', d.netto ? d.netto + ' €' : ''],
    ['Ausgaben / Monat', d.ausgaben ? d.ausgaben + ' €' : ''],
    ['Rücklagen', d.ruecklagen ? d.ruecklagen + ' €' : ''],
    ['Laufende Kredite', d.schulden],
    ['Kredit-Details', d.schulden_info],
  ]);
  addSection('Gesundheit', [
    ['Größe', d.groesse ? d.groesse + ' cm' : ''],
    ['Gewicht', d.gewicht ? d.gewicht + ' kg' : ''],
    ['Krankenkasse', d.krankenkasse],
    ['Raucher', d.raucher],
  ]);
  addSection('Wünsche & Planung', [
    ['Immobilie', d.immobilie],
    ['Wunschrente / Monat', d.wunschrente ? d.wunschrente + ' €' : ''],
    ['Rentenalter', d.rentenalter],
    ['Prioritäten', d.prioritaeten],
    ['Sonstiges', d.sonstiges],
  ]);

  // Build HTML for print
  const css = `
    body { font-family: Arial, sans-serif; font-size: 11pt; color: #1A1D2E; margin: 0; padding: 0; }
    .page { padding: 28mm 20mm; max-width: 210mm; margin: 0 auto; }
    .pdf-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #378ADD; padding-bottom: 12px; margin-bottom: 20px; }
    .pdf-header h1 { font-size: 18pt; font-weight: 700; color: #1A1D2E; margin: 0 0 4px; }
    .pdf-header .sub { font-size: 10pt; color: #7A8299; }
    .pdf-header .meta { text-align: right; font-size: 10pt; color: #7A8299; }
    .pdf-header .berater { font-size: 10pt; font-weight: 600; color: #185FA5; }
    .section { margin-bottom: 16px; break-inside: avoid; }
    .section-title { font-size: 9pt; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: #378ADD; background: #E6F1FB; padding: 4px 8px; border-radius: 4px; margin-bottom: 6px; }
    .field-row { display: flex; padding: 4px 0; border-bottom: 1px solid #F7F8FA; }
    .field-row:last-child { border-bottom: none; }
    .field-key { font-size: 10pt; color: #7A8299; width: 45%; flex-shrink: 0; }
    .field-val { font-size: 10pt; font-weight: 600; color: #1A1D2E; flex: 1; }
    .footer { margin-top: 24px; padding-top: 10px; border-top: 1px solid #EEF0F4; font-size: 9pt; color: #7A8299; display: flex; justify-content: space-between; }
    @media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
  `;

  let sectionsHtml = '';
  let currentSecHtml = '';
  let currentSecTitle = '';

  lines.forEach(l => {
    if (l.type === 'section') {
      if (currentSecTitle) sectionsHtml += `<div class="section"><div class="section-title">${currentSecTitle}</div>${currentSecHtml}</div>`;
      currentSecTitle = l.text;
      currentSecHtml = '';
    } else {
      currentSecHtml += `<div class="field-row"><span class="field-key">${l.key}</span><span class="field-val">${l.val}</span></div>`;
    }
  });
  if (currentSecTitle) sectionsHtml += `<div class="section"><div class="section-title">${currentSecTitle}</div>${currentSecHtml}</div>`;

  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Planungsbogen ${name}</title><style>${css}</style></head><body><div class="page">
    <div class="pdf-header">
      <div>
        <h1>${name}</h1>
        <div class="sub">Bogen zur Planung</div>
      </div>
      <div class="meta">
        <div>${date}</div>
        ${d.berater ? `<div class="berater">Berater: ${d.berater}</div>` : ''}
      </div>
    </div>
    ${sectionsHtml}
    <div class="footer">
      <span>Bogen zur Planung · Vertraulich</span>
      <span>ID: ${currentRow.id}</span>
    </div>
  </div></body></html>`;

  const win = window.open('', '_blank');
  win.document.write(html);
  win.document.close();
  setTimeout(() => { win.focus(); win.print(); }, 400);
}
</script>
</body>
</html>
