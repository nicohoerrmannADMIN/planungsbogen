<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Planungsbogen · Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0B0E14;
    --surface: #141A24;
    --card: #1B2330;
    --border: rgba(255,255,255,.08);
    --ink: #F5F1E8;
    --muted: rgba(245,241,232,.48);
    --gold: #E0A82E;
    --gold-l: rgba(224,168,46,.10);
    --gold-b: rgba(224,168,46,.35);
    --ok: #3FB68B;
    --ok-bg: rgba(63,182,139,.10);
    --ok-b: rgba(63,182,139,.4);
    --red: #D9534F;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', sans-serif;
    --mono: 'JetBrains Mono', monospace;
    --rsm: 5px; --rlg: 8px;
    --shadow: 0 8px 28px -16px rgba(0,0,0,.6);
  }
  body {
    font-family: var(--sans); background: var(--bg); color: var(--ink); min-height: 100vh;
    background-image:
      radial-gradient(ellipse 800px 600px at 0% 0%, rgba(224,168,46,.06), transparent 50%),
      radial-gradient(ellipse 800px 600px at 100% 100%, rgba(224,168,46,.06), transparent 50%);
    background-attachment: fixed;
  }

  /* LOGIN */
  .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; }
  .login-card { background:var(--surface); border-radius:var(--rlg); box-shadow:var(--shadow); border:1px solid var(--border); padding:2.5rem; width:100%; max-width:380px; text-align:center; }
  .login-icon { width:52px; height:52px; border-radius:var(--rlg); background:var(--gold-l); border:1px solid var(--gold-b); display:flex; align-items:center; justify-content:center; margin:0 auto 1.25rem; }
  .login-icon svg { width:24px; height:24px; stroke:var(--gold); }
  .login-card h1 { font-family:var(--serif); font-size:22px; font-weight:700; margin-bottom:8px; }
  .login-card p { font-size:13px; color:var(--muted); margin-bottom:1.5rem; }
  .login-card input { width:100%; padding:11px 14px; font-size:15px; border:1px solid var(--border); border-radius:var(--rsm); background:var(--card); color:var(--ink); outline:none; font-family:var(--sans); margin-bottom:12px; }
  .login-card input::placeholder { color:rgba(245,241,232,.28); }
  .login-card input:focus { border-color:var(--gold-b); box-shadow:0 0 0 3px var(--gold-l); }
  .btn-login { width:100%; padding:12px; background:var(--gold); color:#1a1306; border:none; border-radius:var(--rsm); font-size:15px; font-weight:700; font-family:var(--sans); cursor:pointer; transition:all .2s; }
  .btn-login:hover { background:#f0bb47; box-shadow:0 4px 20px -6px var(--gold-b); }
  .login-err { font-size:13px; color:var(--red); margin-top:8px; display:none; }

  /* TOPBAR */
  .topbar { background:rgba(11,14,20,.85); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); padding:0 2rem; height:56px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
  .topbar-logo { display:flex; align-items:center; gap:10px; font-size:15px; font-weight:700; color:var(--ink); font-family:var(--serif); letter-spacing:.01em; }
  .topbar-icon { width:30px; height:30px; border-radius:var(--rsm); background:var(--gold-l); border:1px solid var(--gold-b); display:flex; align-items:center; justify-content:center; }
  .topbar-icon svg { width:16px; height:16px; stroke:var(--gold); }
  .topbar-right { display:flex; align-items:center; gap:12px; }
  .badge-count { font-size:10px; font-weight:700; background:var(--gold-l); color:var(--gold); padding:4px 10px; border-radius:99px; border:1px solid var(--gold-b); font-family:var(--mono); text-transform:uppercase; letter-spacing:.1em; }
  .btn-logout { font-size:12px; color:var(--muted); background:rgba(255,255,255,.04); border:1px solid var(--border); border-radius:var(--rsm); padding:6px 12px; cursor:pointer; font-family:var(--sans); transition:all .2s; }
  .btn-logout:hover { color:var(--ink); border-color:var(--border); background:rgba(255,255,255,.07); }

  /* TABS */
  .tabs-bar { background:rgba(11,14,20,.6); border-bottom:1px solid var(--border); padding:0 2rem; display:flex; gap:0; }
  .tab-btn { padding:14px 20px; font-size:13px; font-weight:600; color:var(--muted); background:none; border:none; border-bottom:2px solid transparent; cursor:pointer; font-family:var(--sans); transition:all .2s; display:flex; align-items:center; gap:7px; text-transform:uppercase; letter-spacing:.08em; }
  .tab-btn:hover { color:var(--ink); }
  .tab-btn.active { color:var(--gold); border-bottom-color:var(--gold); }
  .tab-btn svg { width:14px; height:14px; }

  /* MAIN */
  .main { max-width:1100px; margin:0 auto; padding:2rem 1.5rem; }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }
  .section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.25rem; flex-wrap:wrap; gap:10px; }
  .section-header h2 { font-family:var(--serif); font-size:22px; font-weight:700; }
  .filters { display:flex; gap:8px; flex-wrap:wrap; }
  .filter-input { padding:9px 14px; font-size:13px; border:1px solid var(--border); border-radius:var(--rsm); background:var(--card); color:var(--ink); outline:none; font-family:var(--sans); min-width:200px; }
  .filter-input::placeholder { color:rgba(245,241,232,.28); }
  .filter-input:focus { border-color:var(--gold-b); box-shadow:0 0 0 3px var(--gold-l); }

  /* TABLE */
  .table-wrap { background:var(--surface); border-radius:var(--rlg); border:1px solid var(--border); box-shadow:var(--shadow); overflow:hidden; }
  table { width:100%; border-collapse:collapse; }
  thead th { padding:12px 16px; text-align:left; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.15em; color:var(--muted); border-bottom:1px solid var(--border); background:rgba(255,255,255,.02); white-space:nowrap; font-family:var(--mono); }
  tbody tr { border-bottom:1px solid var(--border); transition:background .15s; cursor:pointer; }
  tbody tr:last-child { border-bottom:none; }
  tbody tr:hover { background:var(--gold-l); }
  tbody td { padding:13px 16px; font-size:14px; color:var(--ink); }
  .td-name { font-weight:600; color:var(--ink); font-family:var(--serif); font-size:15px; }
  .badge-beruf { font-size:10px; padding:3px 9px; border-radius:99px; background:var(--gold-l); color:var(--gold); border:1px solid var(--gold-b); font-weight:600; white-space:nowrap; font-family:var(--mono); text-transform:uppercase; letter-spacing:.08em; }
  .td-date { font-size:12px; color:var(--muted); white-space:nowrap; font-family:var(--mono); }
  .btn-pdf { display:inline-flex; align-items:center; gap:5px; padding:6px 12px; background:var(--gold); color:#1a1306; border:none; border-radius:var(--rsm); font-size:12px; font-weight:700; font-family:var(--sans); cursor:pointer; white-space:nowrap; transition:all .2s; }
  .btn-pdf:hover { background:#f0bb47; }
  .empty-state { text-align:center; padding:4rem 2rem; color:var(--muted); }

  /* BERATER TAB */
  .berater-grid { display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; }
  .card { background:var(--surface); border-radius:var(--rlg); border:1px solid var(--border); box-shadow:var(--shadow); padding:1.5rem; }
  .card h3 { font-family:var(--serif); font-size:16px; font-weight:700; margin-bottom:1.25rem; display:flex; align-items:center; gap:8px; }
  .card h3 svg { width:16px; height:16px; color:var(--gold); }
  .form-row { display:flex; gap:8px; margin-bottom:12px; }
  .form-row input { flex:1; padding:10px 12px; font-size:14px; border:1px solid var(--border); border-radius:var(--rsm); background:var(--card); color:var(--ink); outline:none; font-family:var(--sans); }
  .form-row input::placeholder { color:rgba(245,241,232,.28); }
  .form-row input:focus { border-color:var(--gold-b); box-shadow:0 0 0 3px var(--gold-l); }
  .btn-add { padding:10px 18px; background:var(--gold); color:#1a1306; border:none; border-radius:var(--rsm); font-size:14px; font-weight:700; font-family:var(--sans); cursor:pointer; white-space:nowrap; transition:all .2s; }
  .btn-add:hover { background:#f0bb47; }
  .berater-list { display:flex; flex-direction:column; gap:8px; margin-top:4px; }
  .berater-item { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:var(--card); border:1px solid var(--border); border-radius:var(--rsm); gap:10px; }
  .berater-info { flex:1; }
  .berater-name { font-size:14px; font-weight:600; color:var(--ink); font-family:var(--serif); }
  .berater-nr { font-size:11px; color:var(--muted); margin-top:2px; font-family:var(--mono); }
  .btn-del { background:rgba(255,255,255,.04); border:1px solid var(--border); border-radius:var(--rsm); padding:5px 10px; font-size:12px; color:var(--muted); cursor:pointer; font-family:var(--sans); transition:all .2s; }
  .btn-del:hover { border-color:var(--red); color:var(--red); background:rgba(217,83,79,.1); }

  /* LINK BOX */
  .link-card { background:var(--surface); border-radius:var(--rlg); border:1px solid var(--border); box-shadow:var(--shadow); padding:1.5rem; margin-top:1.5rem; }
  .link-card h3 { font-family:var(--serif); font-size:16px; font-weight:700; margin-bottom:1rem; }
  .link-select { display:flex; flex-direction:column; gap:8px; }
  .link-item { display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--card); border:1px solid var(--border); border-radius:var(--rsm); }
  .link-item-name { font-size:13px; font-weight:600; color:var(--ink); min-width:160px; font-family:var(--serif); }
  .link-url { font-size:12px; color:var(--muted); flex:1; font-family:var(--mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .btn-copy { display:inline-flex; align-items:center; gap:5px; padding:6px 12px; background:var(--gold); color:#1a1306; border:none; border-radius:var(--rsm); font-size:12px; font-weight:700; font-family:var(--sans); cursor:pointer; white-space:nowrap; flex-shrink:0; transition:all .2s; }
  .btn-copy:hover { background:#f0bb47; }
  .btn-copy.copied { background:var(--ok); color:#0a1f17; }

  /* MODAL */
  .modal-overlay { position:fixed; inset:0; background:rgba(11,14,20,.7); z-index:200; display:flex; align-items:flex-start; justify-content:center; padding:2rem 1rem; overflow-y:auto; backdrop-filter:blur(4px); }
  .modal { background:var(--surface); border-radius:var(--rlg); width:100%; max-width:680px; box-shadow:0 16px 60px -20px rgba(0,0,0,.8); border:1px solid var(--border); }
  .modal-header { display:flex; align-items:center; justify-content:space-between; padding:1.25rem 1.5rem; border-bottom:1px solid var(--border); }
  .modal-header h3 { font-family:var(--serif); font-size:18px; font-weight:700; }
  .modal-actions { display:flex; gap:8px; }
  .btn-close { background:rgba(255,255,255,.04); border:1px solid var(--border); border-radius:var(--rsm); padding:7px 14px; font-size:13px; color:var(--muted); cursor:pointer; font-family:var(--sans); transition:all .2s; }
  .btn-close:hover { background:rgba(255,255,255,.07); color:var(--ink); }
  .modal-body { padding:1.5rem; }
  .detail-section { margin-bottom:1.25rem; }
  .detail-section h4 { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.2em; color:var(--gold); margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid var(--border); font-family:var(--mono); }
  .detail-row { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,.03); }
  .detail-row:last-child { border-bottom:none; }
  .detail-key { font-size:12px; color:var(--muted); flex-shrink:0; min-width:140px; }
  .detail-val { font-size:13px; color:var(--ink); font-weight:500; text-align:right; word-break:break-word; }
  .tag-list { display:flex; flex-wrap:wrap; gap:4px; justify-content:flex-end; }
  .tag { font-size:11px; padding:2px 8px; border-radius:99px; background:var(--gold-l); color:var(--gold); border:1px solid var(--gold-b); font-family:var(--mono); }

  .spinner { display:inline-block; width:18px; height:18px; border:2px solid var(--gold-l); border-top-color:var(--gold); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading-row { text-align:center; padding:3rem; }
  .hidden { display:none !important; }
  .toast-bar { position:fixed; bottom:2rem; left:50%; transform:translateX(-50%); background:var(--card); color:var(--ink); border:1px solid var(--border); padding:10px 20px; border-radius:var(--rsm); font-size:14px; font-weight:500; opacity:0; transition:opacity .3s; pointer-events:none; z-index:9999; white-space:nowrap; }
  .toast-bar.show { opacity:1; }

  @media(max-width:700px) {
    .berater-grid { grid-template-columns:1fr; }
    .main { padding:1rem; }
    .topbar, .tabs-bar { padding:0 1rem; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="login-wrap">
  <div class="login-card">
    <div class="login-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1>Admin · Planungsbogen</h1>
    <p>Nur für interne Nutzung</p>
    <input type="email" id="email-input" placeholder="E-Mail" autocomplete="username" />
    <input type="password" id="pw-input" placeholder="Passwort" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()" />
    <button class="btn-login" onclick="doLogin()" id="login-btn">Einloggen</button>
    <p class="login-err" id="login-err">Login fehlgeschlagen</p>
  </div>
</div>

<!-- ADMIN APP -->
<div id="admin-app" class="hidden">
  <div class="topbar">
    <div class="topbar-logo">
      <div class="topbar-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
      </div>
      Planungsbogen Admin
    </div>
    <div class="topbar-right">
      <span class="badge-count" id="total-count">0 Einträge</span>
      <button class="btn-logout" onclick="logout()">Abmelden</button>
    </div>
  </div>

  <div class="tabs-bar">
    <button class="tab-btn active" id="tab-einreichungen" onclick="switchTab('einreichungen')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
      Einreichungen
    </button>
    <button class="tab-btn" id="tab-berater" onclick="switchTab('berater')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Berater & Links
    </button>
  </div>

  <div class="main">

    <!-- TAB: EINREICHUNGEN -->
    <div class="tab-panel active" id="panel-einreichungen">
      <div class="section-header">
        <h2>Alle Einreichungen</h2>
        <div class="filters">
          <input class="filter-input" type="text" id="search-input" placeholder="Name oder Berater suchen…" oninput="renderTable()" />
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Beruf</th>
              <th>Berater</th>
              <th>Datum</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr><td colspan="5" class="loading-row"><div class="spinner"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- TAB: BERATER -->
    <div class="tab-panel hidden" id="panel-berater">
      <div class="section-header">
        <h2>Berater verwalten</h2>
      </div>

      <div class="berater-grid">
        <!-- Neuen Berater anlegen -->
        <div class="card">
          <h3>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Neuen Berater anlegen
          </h3>
          <div class="form-row">
            <input type="text" id="new-name" placeholder="Vollständiger Name" />
          </div>
          <div class="form-row">
            <input type="text" id="new-nr" placeholder="Partnernummer (z. B. 779266)" />
          </div>
          <div class="form-row">
            <input type="email" id="new-email" placeholder="E-Mail für Benachrichtigungen" />
            <button class="btn-add" onclick="addBerater()">Anlegen</button>
          </div>
        </div>

        <!-- Bestehende Berater -->
        <div class="card">
          <h3>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            Angelegte Berater
          </h3>
          <div class="berater-list" id="berater-list">
            <div class="loading-row"><div class="spinner"></div></div>
          </div>
        </div>
      </div>

      <!-- Link Generator -->
      <div class="link-card">
        <h3>🔗 Persönliche Links zum Kopieren</h3>
        <div class="link-select" id="link-list">
          <p style="font-size:13px;color:var(--g500);">Noch keine Berater angelegt.</p>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay hidden" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h3 id="modal-title">–</h3>
      <div class="modal-actions">
        <button class="btn-pdf" onclick="downloadPDF()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          PDF
        </button>
        <button class="btn-close" onclick="document.getElementById('modal-overlay').classList.add('hidden')">Schließen</button>
      </div>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="toast-bar" id="toast"></div>

<script>
const SUPA_URL = 'https://jtlblbgxzbxjplamdpiu.supabase.co';
const SUPA_KEY = 'sb_publishable_XZaNy8RC0iATbuq2IVJ0Qg_9qNDsMBd';
const BASE_URL = 'https://planungsbogen.vercel.app/planungsbogen.html';

let allRows = [];
let allBerater = [];
let currentRow = null;
let accessToken = null;

// ── AUTH HEADERS ────────────────────────────────────────
function authHeaders(extra) {
  return Object.assign({
    'apikey': SUPA_KEY,
    'Authorization': 'Bearer ' + (accessToken || SUPA_KEY)
  }, extra || {});
}

// ── LOGIN ─────────────────────────────────────────────────
async function doLogin() {
  const email = document.getElementById('email-input').value.trim();
  const password = document.getElementById('pw-input').value;
  const btn = document.getElementById('login-btn');
  document.getElementById('login-err').style.display = 'none';
  btn.textContent = 'Einloggen…';
  btn.disabled = true;
  try {
    const res = await fetch(SUPA_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPA_KEY },
      body: JSON.stringify({ email, password })
    });
    const json = await res.json();
    if (!res.ok || !json.access_token) throw new Error();
    accessToken = json.access_token;
    sessionStorage.setItem('pb_token', accessToken);
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('admin-app').classList.remove('hidden');
    loadData();
    loadBerater();
  } catch {
    document.getElementById('login-err').style.display = 'block';
    btn.textContent = 'Einloggen';
    btn.disabled = false;
  }
}

function logout() {
  accessToken = null;
  sessionStorage.removeItem('pb_token');
  document.getElementById('admin-app').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('pw-input').value = '';
  document.getElementById('login-btn').textContent = 'Einloggen';
  document.getElementById('login-btn').disabled = false;
}

// Auto-login if session token still valid
(function checkSession() {
  const saved = sessionStorage.getItem('pb_token');
  if (saved) {
    accessToken = saved;
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('admin-app').classList.remove('hidden');
    loadData();
    loadBerater();
  }
})();

// ── TABS ──────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => { p.classList.remove('active'); p.classList.add('hidden'); });
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('panel-' + tab).classList.remove('hidden');
  document.getElementById('panel-' + tab).classList.add('active');
}

// ── EINREICHUNGEN ─────────────────────────────────────────
async function loadData() {
  try {
    const res = await fetch(SUPA_URL + '/rest/v1/planungsbogen?select=*&order=created_at.desc', {
      headers: authHeaders()
    });
    allRows = await res.json();
    document.getElementById('total-count').textContent = allRows.length + ' Einträge';
    renderTable();
  } catch {
    document.getElementById('table-body').innerHTML = '<tr><td colspan="5" style="text-align:center;padding:2rem;color:#A32D2D;">Ladefehler</td></tr>';
  }
}

function renderTable() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const rows = allRows.filter(r => {
    const name = ((r.vorname||'') + ' ' + (r.nachname||'')).toLowerCase();
    const berater = getBeraterName(r.data?.nr || r.berater || '').toLowerCase();
    return !q || name.includes(q) || berater.includes(q);
  });
  if (!rows.length) {
    document.getElementById('table-body').innerHTML = `<tr><td colspan="5"><div class="empty-state">Keine Einträge gefunden</div></td></tr>`;
    return;
  }
  document.getElementById('table-body').innerHTML = rows.map(r => {
    const d = r.data || {};
    const name = [r.vorname, r.nachname].filter(Boolean).join(' ') || '–';
    const beruf = d.beruf || '–';
    const nr = d.nr || r.berater || '';
    const beraterName = getBeraterName(nr) || nr || '–';
    const date = r.created_at ? new Date(r.created_at).toLocaleDateString('de-DE', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '–';
    return `<tr onclick="openModal('${r.id}')">
      <td><div class="td-name">${name}</div></td>
      <td><span class="badge-beruf">${beruf}</span></td>
      <td style="font-size:13px">${beraterName}</td>
      <td class="td-date">${date}</td>
      <td style="display:flex;gap:6px;align-items:center">
        <button class="btn-pdf" onclick="event.stopPropagation();downloadPDFById('${r.id}')">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          PDF</button>
        <button class="btn-del" onclick="event.stopPropagation();deleteEintrag('${r.id}')">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </button>
      </td>
    </tr>`;
  }).join('');
}

function getBeraterName(nr) {
  const b = allBerater.find(b => b.nr === nr);
  return b ? b.name : '';
}

async function deleteEintrag(id) {
  if (!confirm('Eintrag wirklich löschen?')) return;
  await fetch(SUPA_URL + '/rest/v1/planungsbogen?id=eq.' + id, {
    method: 'DELETE',
    headers: authHeaders()
  });
  allRows = allRows.filter(r => r.id !== id);
  document.getElementById('total-count').textContent = allRows.length + ' Einträge';
  renderTable();
  showToast('Eintrag gelöscht');
}

// ── BERATER ───────────────────────────────────────────────
async function loadBerater() {
  try {
    const res = await fetch(SUPA_URL + '/rest/v1/berater?select=*&order=name.asc', {
      headers: authHeaders()
    });
    allBerater = await res.json();
    renderBeraterList();
    renderLinkList();
  } catch {
    document.getElementById('berater-list').innerHTML = '<p style="font-size:13px;color:#A32D2D;">Ladefehler</p>';
  }
}

function renderBeraterList() {
  if (!allBerater.length) {
    document.getElementById('berater-list').innerHTML = '<p style="font-size:13px;color:var(--g500);">Noch keine Berater angelegt.</p>';
    return;
  }
  document.getElementById('berater-list').innerHTML = allBerater.map(b => `
    <div class="berater-item">
      <div class="berater-info">
        <div class="berater-name">${b.name}</div>
        <div class="berater-nr">Nr. ${b.nr} · ${b.email || 'Keine E-Mail'}</div>
      </div>
      <button class="btn-del" onclick="deleteBerater('${b.nr}')">Löschen</button>
    </div>
  `).join('');
}

function renderLinkList() {
  if (!allBerater.length) {
    document.getElementById('link-list').innerHTML = '<p style="font-size:13px;color:var(--g500);">Noch keine Berater angelegt.</p>';
    return;
  }
  document.getElementById('link-list').innerHTML = allBerater.map(b => {
    const url = BASE_URL + '?nr=' + b.nr;
    return `<div class="link-item">
      <div class="link-item-name">${b.name}</div>
      <div class="link-url">${url}</div>
      <button class="btn-copy" id="copy-${b.nr}" onclick="copyLink('${url}','${b.nr}')">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Kopieren
      </button>
    </div>`;
  }).join('');
}

async function addBerater() {
  const name = document.getElementById('new-name').value.trim();
  const nr = document.getElementById('new-nr').value.trim();
  const email = document.getElementById('new-email').value.trim();
  if (!name || !nr || !email) { showToast('Name, Nummer und E-Mail eingeben'); return; }
  try {
    const res = await fetch(SUPA_URL + '/rest/v1/berater', {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json', 'Prefer': 'return=minimal' }),
      body: JSON.stringify({ nr, name, email })
    });
    if (!res.ok) throw new Error();
    document.getElementById('new-name').value = '';
    document.getElementById('new-nr').value = '';
    document.getElementById('new-email').value = '';
    showToast('Berater angelegt ✓');
    await loadBerater();
    renderTable();
  } catch {
    showToast('Fehler – Nummer bereits vergeben?');
  }
}

async function deleteBerater(nr) {
  if (!confirm('Berater wirklich löschen?')) return;
  await fetch(SUPA_URL + '/rest/v1/berater?nr=eq.' + nr, {
    method: 'DELETE',
    headers: authHeaders()
  });
  showToast('Berater gelöscht');
  await loadBerater();
}

function copyLink(url, nr) {
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('copy-' + nr);
    btn.textContent = '✓ Kopiert';
    btn.classList.add('copied');
    setTimeout(() => { btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Kopieren`; btn.classList.remove('copied'); }, 2000);
  });
}

// ── MODAL ─────────────────────────────────────────────────
function openModal(id) {
  currentRow = allRows.find(r => r.id === id);
  if (!currentRow) return;
  const name = [currentRow.vorname, currentRow.nachname].filter(Boolean).join(' ') || 'Unbekannt';
  document.getElementById('modal-title').textContent = name;
  document.getElementById('modal-body').innerHTML = buildDetail(currentRow.data || {});
  document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal(e) {
  if (e.target === document.getElementById('modal-overlay')) document.getElementById('modal-overlay').classList.add('hidden');
}

function drow(key, val) {
  if (!val) return '';
  if (Array.isArray(val)) {
    if (!val.length) return '';
    if (typeof val[0] === 'object') return `<div class="detail-row"><span class="detail-key">${key}</span><div class="detail-val">${val.map(k=>k.name+(k.geb?' ('+k.geb+')':'')).join('<br>')}</div></div>`;
    return `<div class="detail-row"><span class="detail-key">${key}</span><div class="detail-val tag-list">${val.map(v=>`<span class="tag">${v}</span>`).join('')}</div></div>`;
  }
  return `<div class="detail-row"><span class="detail-key">${key}</span><span class="detail-val">${val}</span></div>`;
}
function dsec(title, content) {
  if (!content.trim()) return '';
  return `<div class="detail-section"><h4>${title}</h4>${content}</div>`;
}

function buildDetail(d) {
  const nr = d.nr || currentRow.berater || '';
  const beraterName = getBeraterName(nr) || nr || '–';
  const date = currentRow.created_at ? new Date(currentRow.created_at).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
  return `
    ${dsec('Persönliches', drow('Anrede',d.anrede)+drow('Name',[d.vorname,d.nachname].filter(Boolean).join(' '))+drow('Geburtsdatum',d.geburtsdatum)+drow('Familienstand',d.familienstand)+drow('Verheiratet seit',d.heiratsdatum)+drow('Kinder',d.kinder))}
    ${dsec('Kontakt', drow('Adresse',[d.strasse,d.plz,d.ort].filter(Boolean).join(', '))+drow('Bundesland',d.bundesland)+drow('Telefon',d.telefon)+drow('E-Mail',d.email))}
    ${dsec('Beruf', drow('Beruf',d.beruf)+drow('Berufsbezeichnung',d.berufsbezeichnung)+drow('Ausbildungsberuf',d.ausbildungsberuf)+drow('Lehrjahr',d.lehrjahr)+drow('Studiengang',d.studiengang)+drow('Semester',d.semester)+drow('Studienabschluss',d.studienabschluss)+drow('Branche',d.branche)+drow('Rechtsform',d.rechtsform)+drow('Selbstständig seit',d['selbst-seit'])+drow('Beamtenverhältnis',d.beamtenverhaeltnis)+drow('Dienstbeginn',d.dienstbeginn)+drow('Besoldungsgruppe',d.besoldungsgruppe)+drow('Besoldungsstufe',d.besoldungsstufe)+drow('Dienststelle',d.dienststelle)+drow('Bildungsabschluss',d.bildung)+drow('Ausbildung',d.ausbildung)+drow('Körperlich %',d.koerperlich||d['koerperlich-az']||d['koerperlich-ss']))}
    ${dsec('Finanzen', drow('Jahresbrutto',d.jahresbrutto?d.jahresbrutto+' €':'')+drow('Netto / Monat',d.netto?d.netto+' €':'')+drow('Ausgaben / Monat',d.ausgaben?d.ausgaben+' €':'')+drow('Rücklagen',d.ruecklagen?d.ruecklagen+' €':''))}
    ${dsec('Gesundheit', drow('Größe',d.groesse?d.groesse+' cm':'')+drow('Gewicht',d.gewicht?d.gewicht+' kg':'')+drow('Krankenkasse',d.krankenkasse)+drow('Raucher',d.raucher))}
    ${dsec('Wünsche & Planung', drow('Immobilie',d.immobilie)+drow('Wunschrente / Monat',d.wunschrente?d.wunschrente+' €':'')+drow('Rentenalter',d.rentenalter)+drow('Prioritäten',d.prioritaeten)+drow('Sonstiges',d.sonstiges))}
    ${dsec('Meta', drow('Berater',beraterName)+drow('Partnernummer',nr)+drow('Eingereicht am',date))}
  `;
}

// ── PDF ───────────────────────────────────────────────────
function downloadPDFById(id) { currentRow = allRows.find(r => r.id === id); if (currentRow) downloadPDF(); }

function downloadPDF() {
  if (!currentRow) return;
  const d = currentRow.data || {};
  const nr = d.nr || currentRow.berater || '';
  const beraterName = getBeraterName(nr) || nr || '';
  const name = [currentRow.vorname, currentRow.nachname].filter(Boolean).join(' ') || 'Unbekannt';
  const date = currentRow.created_at ? new Date(currentRow.created_at).toLocaleDateString('de-DE') : '';

  const sections = [
    ['Persönliches', [['Anrede',d.anrede],['Name',[d.vorname,d.nachname].filter(Boolean).join(' ')],['Geburtsdatum',d.geburtsdatum],['Familienstand',d.familienstand],['Verheiratet seit',d.heiratsdatum],['Kinder',d.kinder]]],
    ['Kontakt', [['Adresse',[d.strasse,d.plz,d.ort].filter(Boolean).join(', ')],['Bundesland',d.bundesland],['Telefon',d.telefon],['E-Mail',d.email]]],
    ['Beruf', [['Beruf',d.beruf],['Berufsbezeichnung',d.berufsbezeichnung],['Ausbildungsberuf',d.ausbildungsberuf],['Lehrjahr',d.lehrjahr],['Studiengang',d.studiengang],['Semester',d.semester],['Studienabschluss',d.studienabschluss],['Branche',d.branche],['Rechtsform',d.rechtsform],['Selbstständig seit',d['selbst-seit']],['Beamtenverhältnis',d.beamtenverhaeltnis],['Dienstbeginn',d.dienstbeginn],['Besoldungsgruppe',d.besoldungsgruppe],['Besoldungsstufe',d.besoldungsstufe],['Dienststelle',d.dienststelle],['Bildungsabschluss',d.bildung],['Ausbildung',d.ausbildung],['Körperlich %',d.koerperlich||d['koerperlich-az']||d['koerperlich-ss']]]],
    ['Finanzen', [['Jahresbrutto',d.jahresbrutto?d.jahresbrutto+' €':''],['Netto / Monat',d.netto?d.netto+' €':''],['Ausgaben / Monat',d.ausgaben?d.ausgaben+' €':''],['Rücklagen',d.ruecklagen?d.ruecklagen+' €':'']]],
    ['Gesundheit', [['Größe',d.groesse?d.groesse+' cm':''],['Gewicht',d.gewicht?d.gewicht+' kg':''],['Krankenkasse',d.krankenkasse],['Raucher',d.raucher]]],
    ['Wünsche & Planung', [['Immobilie',d.immobilie],['Wunschrente / Monat',d.wunschrente?d.wunschrente+' €':''],['Rentenalter',d.rentenalter],['Prioritäten',d.prioritaeten],['Sonstiges',d.sonstiges]]],
  ];

  const css = `body{font-family:Arial,sans-serif;font-size:11pt;color:#1A1D2E;margin:0;padding:0}.page{padding:20mm 18mm;max-width:210mm;margin:0 auto}.hdr{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #378ADD;padding-bottom:12px;margin-bottom:18px}.hdr h1{font-size:18pt;font-weight:700;margin:0 0 4px}.hdr .sub{font-size:10pt;color:#7A8299}.hdr .meta{text-align:right;font-size:10pt;color:#7A8299}.hdr .ber{font-size:10pt;font-weight:600;color:#185FA5}.sec{margin-bottom:14px;break-inside:avoid}.sec-t{font-size:9pt;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#378ADD;background:#E6F1FB;padding:4px 8px;border-radius:4px;margin-bottom:6px}.frow{display:flex;padding:4px 0;border-bottom:1px solid #F7F8FA}.frow:last-child{border-bottom:none}.fkey{font-size:10pt;color:#7A8299;width:42%;flex-shrink:0}.fval{font-size:10pt;font-weight:600;color:#1A1D2E;flex:1}.footer{margin-top:20px;padding-top:8px;border-top:1px solid #EEF0F4;font-size:9pt;color:#7A8299;display:flex;justify-content:space-between}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}`;

  let body = '';
  sections.forEach(([title, fields]) => {
    if (!fields.length) return;
    body += `<div class="sec"><div class="sec-t">${title}</div>`;
    fields.forEach(([k,v]) => {
      let val = '';
      if (Array.isArray(v) && v.length) {
        val = typeof v[0]==='object' ? v.map(x=>x.name+(x.geb?' ('+x.geb+')':'')).join(', ') : v.join(', ');
      } else if (v) {
        val = String(v);
      }
      body += `<div class="frow"><span class="fkey">${k}</span><span class="fval">${val}</span></div>`;
    });
    body += '</div>';
  });

  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Planungsbogen ${name}</title><style>${css}</style></head><body><div class="page"><div class="hdr"><div><h1>${name}</h1><div class="sub">Bogen zur Planung</div></div><div class="meta"><div>${date}</div>${beraterName?`<div class="ber">Berater: ${beraterName}</div>`:''}</div></div>${body}<div class="footer"><span>Bogen zur Planung · Vertraulich</span><span>ID: ${currentRow.id}</span></div></div></body></html>`;

  const win = window.open('', '_blank');
  win.document.write(html);
  win.document.close();
  setTimeout(() => { win.focus(); win.print(); }, 400);
}

// ── TOAST ─────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
